.hero-f{fill:#1F1E1D;fill-opacity:.05}.hero-r{fill:#1F1E1D;fill-opacity:.3}
@media (prefers-color-scheme: dark){.hero-f{fill:#F4F1E8;fill-opacity:.3}.hero-r{fill:#F4F1E8;fill-opacity:.62}}.cw g{transform-box:fill-box}.cw-lid{opacity:0}.cw-work .cw-la{animation:cw-st .5s steps(1) infinite}.cw-work .cw-lb{animation:cw-st .5s steps(1) infinite -.25s}.cw-work .cw-bd{animation:cw-bob .5s steps(1) infinite -.125s}.cw-r-engineer.cw-work .cw-it{transform-origin:100% 100%;animation:cw-twist .5s ease-in-out infinite}.cw-b1,.cw-b2,.cw-b3{transform-origin:50% 100%}.cw-mk{fill:#85857f}@media (prefers-color-scheme: dark){.cw-mk{fill:#b4b3ad}}@media (prefers-reduced-motion: reduce){.cw,.cw *{animation:none!important}}@keyframes cw-st{50%{transform:translateY(-1px)}}@keyframes cw-bob{50%{transform:translateY(1px)}}@keyframes cw-twist{50%{transform:rotate(-35deg)}}</style><g class="hero" transform="translate(0,0) scale(3)"><path class="hero-f" d="M2 1H32V2H33V30H32V31H2V30H1V2H2Z"/><path class="hero-r" fill-rule="evenodd" d="M1 0H33V1H34V31H33V32H1V31H0V1H1ZM2 1H32V2H33V30H32V31H2V30H1V2H2Z"/></g><g transform="translate(6,6) scale(3)"><g class="cw cw-r-engineer cw-work"><g class="cw-bd"><g fill="#D97757"><rect x="7" y="10" width="16" height="12"/><rect x="3" y="14" width="4" height="4"/><rect x="23" y="14" width="4" height="4"/></g><rect x="9" y="12" width="2" height="2" fill="#1F1E1D"/><rect x="19" y="12" width="2" height="2" fill="#1F1E1D"/><rect x="11" y="4" width="8" height="1" fill="#F5C542"/><rect x="9" y="5" width="5" height="1" fill="#F5C542"/><rect x="14" y="5" width="2" height="4" fill="#FBE08A"/><g fill="#F5C542"><rect x="16" y="5" width="5" height="1"/><rect x="8" y="6" width="6" height="2"/><rect x="16" y="6" width="6" height="2"/><rect x="7" y="8" width="7" height="1"/><rect x="16" y="8" width="7" height="1"/></g><rect x="6" y="9" width="18" height="1" fill="#C99A1E"/><rect x="13" y="5" width="4" height="2" fill="#BB811B"/><g class="cw-it"><g fill="#8E929A"><rect x="1" y="10" width="1" height="1"/><rect x="3" y="10" width="1" height="1"/><rect